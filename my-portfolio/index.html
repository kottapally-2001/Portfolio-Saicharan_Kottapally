<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0a12" />
    <script>
      /* Apply the saved or system theme before first paint (no flash) */
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#fbf7f2");
        }
      })();
    </script>
    <meta
      name="description"
      content="Sai Charan Kottapally — Software Engineer building scalable full-stack and AI-powered applications with React, NestJS, Node.js and PostgreSQL."
    />
    <title>Sai Charan Kottapally — Software Engineer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

  </body>
</html>
